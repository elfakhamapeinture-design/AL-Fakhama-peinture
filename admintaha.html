<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>لوحة إدارة — الفخامة للدهن</title>
<link rel="icon" id="favicon" type="image/webp" href="">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=El+Messiri:wght@500;600;700&family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#201D1A; --canvas:#FAF6EF; --canvas-warm:#F1E7D6; --brass:#B8862E;
    --terracotta:#B24B32; --teal:#1F5F58; --sage:#6E7F52; --muted:#7A7266;
    --line:rgba(32,29,26,0.10); --shadow:0 10px 30px rgba(32,29,26,0.10);
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--canvas);color:var(--ink);font-family:'Tajawal',sans-serif;}
  h1,h2,h3{font-family:'El Messiri',serif;margin:0;}
  button{font-family:inherit;cursor:pointer;border:none;}
  .top{background:var(--ink);color:#fff;padding:16px 24px;display:flex;justify-content:space-between;align-items:center;}
  .brand{font-family:'El Messiri',serif;font-weight:700;font-size:20px;display:flex;align-items:center;gap:10px;}
  .brand-mark{width:28px;height:28px;border-radius:7px;background:conic-gradient(from 200deg,var(--terracotta),#D9A441,var(--teal),#5B3A5C);}
  .btn{padding:9px 16px;border-radius:9px;font-weight:700;font-size:13.5px;}
  .btn-ghost{background:transparent;border:1.5px solid #fff;color:#fff;}
  .btn-brass{background:var(--brass);color:#fff;}
  .btn-brass:disabled{opacity:0.6;cursor:not-allowed;}
  .top-actions{display:flex;gap:10px;align-items:center;}
  .body{max-width:1220px;margin:0 auto;padding:30px 24px 70px;}
  .login-box{max-width:360px;margin:80px auto;background:#fff;padding:34px;border-radius:16px;box-shadow:var(--shadow);text-align:center;}
  .login-box input{width:100%;padding:12px 14px;border-radius:10px;border:1.5px solid var(--line);font-size:14px;margin-bottom:14px;}
  .tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:26px;}
  .tab-btn{padding:9px 16px;border-radius:10px;background:#fff;border:1.5px solid var(--line);font-weight:700;font-size:13.5px;}
  .tab-btn.active{background:var(--ink);color:#fff;border-color:var(--ink);}
  .stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:18px;margin-bottom:30px;}
  .stat-card{background:#fff;border-radius:14px;padding:20px;box-shadow:var(--shadow);border-top:4px solid var(--brass);}
  .stat-card.warn{border-top-color:var(--terracotta);}
  .stat-card b{font-family:'El Messiri',serif;font-size:26px;display:block;}
  .stat-card span{color:var(--muted);font-size:13px;}
  table{width:100%;border-collapse:collapse;background:#fff;border-radius:14px;overflow:hidden;box-shadow:var(--shadow);}
  th,td{padding:10px 12px;text-align:right;font-size:13px;border-bottom:1px solid var(--line);vertical-align:middle;}
  th{background:var(--canvas-warm);font-weight:800;}
  .mini-btn{padding:6px 10px;border-radius:7px;font-size:12px;font-weight:700;}
  .mini-brass{background:var(--brass);color:#fff;}
  .mini-red{background:#f6dcd4;color:var(--terracotta);}
  .mini-gray{background:#eee;color:var(--ink);}
  .mini-input{width:75px;padding:6px 8px;border-radius:6px;border:1.5px solid var(--line);font-size:12.5px;}
  .admin-form{background:#fff;border-radius:14px;padding:20px;box-shadow:var(--shadow);margin-bottom:20px;}
  .admin-form .row{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;align-items:end;}
  .admin-form input,.admin-form select{padding:9px 12px;border-radius:8px;border:1.5px solid var(--line);font-family:inherit;font-size:13.5px;width:100%;}
  .field-label{font-size:12px;color:var(--muted);display:block;margin-bottom:4px;}
  .low-flag{color:var(--terracotta);font-weight:800;}
  .empty-note{color:var(--muted);text-align:center;padding:30px 0;}
  .pay-full{color:var(--sage);font-weight:800;}
  .pay-partial{color:#8a6a1f;font-weight:800;}
  .pay-none{color:var(--terracotta);font-weight:800;}
  img.gal-thumb{width:60px;height:44px;object-fit:cover;border-radius:6px;display:block;}
  img.prod-thumb{width:52px;height:52px;object-fit:cover;border-radius:8px;display:block;margin-bottom:6px;background:var(--canvas-warm);}
  .row-file{width:110px;font-size:11px;}
  .upload-status{font-size:12.5px;color:var(--muted);margin-top:8px;display:none;}
  .upload-status.err{color:var(--terracotta);}
  .upload-status.ok{color:var(--sage);}
  .search-box{margin-bottom:16px;}
  .search-box input{width:100%;padding:10px 14px;border-radius:10px;border:1.5px solid var(--line);font-size:14px;}
  .cost-hint{color:var(--muted);font-size:11px;}
  .order-edit-panel{padding:16px;}
  .order-edit-panel table{box-shadow:none;margin-bottom:12px;}
</style>
</head>

    <div id="tabContent"><div class="empty-note">جاري التحميل...</div></div>

</div>

let DB = { products:[], craftsmen:[], orders:[], messages:[], finance:[], gallery:[], applications:[] };

function doLogin(){
  if(document.getElementById('adminPass').value === LOGIN_PASSWORD){
    document.getElementById('loginView').style.display='none';
    document.getElementById('dashView').style.display='block';
    refreshAll();
  } else {
    document.getElementById('loginErr').style.display='block';
  }
}

async function refreshAll(){
  document.getElementById('tabContent').innerHTML = '<div class="empty-note">جاري تحميل البيانات من جوجل شيت...</div>';
  try{
    const res = await fetch(SHEET_API_URL + '?key=' + encodeURIComponent(ADMIN_KEY));
    const data = await res.json();
    DB.products = (data.products||[]).map(p=>({
      ...p, id:Number(p.id), price:Number(p.price)||0, stock:Number(p.stock)||0,
      costPrice:Number(p.costPrice)||0, wholesalePrice:Number(p.wholesalePrice)||0,
      reference:p.reference||'', barcode:p.barcode||''
    }));
    DB.craftsmen = (data.craftsmen||[]).map(c=>({...c, id:Number(c.id)}));
    DB.orders = (data.orders||[]).map(o=>({...o, id:Number(o.id), total:Number(o.total), paid:Number(o.paid), remaining:Number(o.remaining), items:JSON.parse(o.itemsJson||'[]')}));
    DB.messages = data.messages||[];
    DB.finance = (data.finance||[]).map(f=>({...f, id:Number(f.id), amount:Number(f.amount)}));
    DB.gallery = (data.gallery||[]).map(g=>({...g, id:Number(g.id)}));
    DB.applications = data.applications||[];
    switchTab('overview');
  }catch(err){
    document.getElementById('tabContent').innerHTML = '<div class="empty-note">تعذّر تحميل البيانات. تحقق من رابط SHEET_API_URL والاتصال بالإنترنت.</div>';
    console.error(err);
  }
}

async function callApi(action, payload){
  try{
    const res = await fetch(SHEET_API_URL, { method:'POST', body: JSON.stringify({action, key:ADMIN_KEY, ...payload}) });
    return await res.json();
  }catch(err){
    console.error(err);
    return {ok:false};
  }
}

/* ---------- رفع الصور مباشرة من الجهاز ---------- */
function fileToBase64(file){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = ()=> resolve(String(reader.result).split(',')[1]);
    reader.onerror = ()=> reject(new Error('تعذّرت قراءة الملف'));
    reader.readAsDataURL(file);
  });
}

async function uploadImageFile(file){
  if(file.size > 8 * 1024 * 1024){
    return {ok:false, error:'الملف كبير جدًا (الحد الأقصى 8 ميغابايت تقريبًا)'};
  }
  const base64 = await fileToBase64(file);
  const res = await callApi('uploadImage', {base64, fileName:file.name, mimeType:file.type});
  if(!res.ok){
    // نعرض رسالة الخطأ التفصيلية القادمة من Apps Script إن وُجدت (تفيد في التشخيص)
    const detail = res.message ? (res.error + ': ' + res.message) : res.error;
    return {ok:false, error: detail || 'خطأ غير معروف'};
  }
  return res;
}

function switchTab(tab){
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.toggle('active', b.dataset.tab===tab));
  const c = document.getElementById('tabContent');
  if(tab==='overview')   c.innerHTML = renderOverview();
  if(tab==='products')   { c.innerHTML = renderProducts(); bindProductsEvents(); }
  if(tab==='warehouse')  c.innerHTML = renderWarehouse();
  if(tab==='gallery')    { c.innerHTML = renderGallery(); bindGalleryEvents(); }
  if(tab==='orders')     c.innerHTML = renderOrders();
  if(tab==='finance')    c.innerHTML = renderFinance();
  if(tab==='craftsmen')  c.innerHTML = renderCraftsmen();
  if(tab==='messages')   c.innerHTML = renderMessages();
  if(tab==='applications') c.innerHTML = renderApplications();
}

function fmt(n){ return (Number(n)||0).toLocaleString('ar-DZ') + ' دج'; }
function esc(s){ return String(s??'').replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }

/* ---------- نظرة عامة ---------- */
function renderOverview(){
  const income = DB.finance.filter(f=>f.type==='income').reduce((a,f)=>a+f.amount,0);
  const expense = DB.finance.filter(f=>f.type==='expense').reduce((a,f)=>a+f.amount,0);
  const lowStock = DB.products.filter(p=>p.stock<=5).length;
  const totalDebt = DB.orders.reduce((s,o)=>s+o.remaining,0);
  return `<div class="stat-grid">
    <div class="stat-card"><b>${DB.orders.length}</b><span>عدد الطلبات</span></div>
    <div class="stat-card"><b>${fmt(income-expense)}</b><span>الرصيد الصافي</span></div>
    <div class="stat-card warn"><b>${fmt(totalDebt)}</b><span>إجمالي الديون على العملاء</span></div>
    <div class="stat-card ${lowStock>0?'warn':''}"><b>${lowStock}</b><span>منتجات كميتها منخفضة</span></div>
    <div class="stat-card"><b>${DB.craftsmen.filter(c=>c.status==='free').length}</b><span>حرفيون متاحون الآن</span></div>
    <div class="stat-card"><b>${DB.messages.length}</b><span>رسائل واردة</span></div>
  </div>
  <button class="btn btn-brass" onclick="refreshAll()">🔄 تحديث البيانات</button>`;
}

/* ---------- المنتجات ---------- */
function renderProducts(){
  return `<div class="admin-form">
    <h3 style="margin-bottom:12px;">إضافة منتج جديد</h3>
    <div class="row">
      <div><span class="field-label">اسم المنتج</span><input id="npName" placeholder="اسم المنتج"></div>
      <div><span class="field-label">المرجع (اختياري)</span><input id="npReference" placeholder="مثال: REF-001"></div>
      <div><span class="field-label">الكود بار (اختياري)</span><input id="npBarcode" placeholder="رقم الكود بار"></div>
      <div><span class="field-label">وصف مختصر</span><input id="npDesc" placeholder="وصف مختصر"></div>
      <div><span class="field-label">سعر الشراء (دج)</span><input id="npCost" type="number" placeholder="سعر الشراء"></div>
      <div><span class="field-label">سعر البيع (دج)</span><input id="npPrice" type="number" placeholder="سعر البيع"></div>
      <div><span class="field-label">سعر الجملة (دج)</span><input id="npWholesale" type="number" placeholder="سعر البيع بالجملة"></div>
      <div><span class="field-label">الكمية</span><input id="npStock" type="number" placeholder="الكمية بالمستودع"></div>
      <div><span class="field-label">صورة المنتج (اختياري)</span><input type="file" id="npImageFile" accept="image/*"></div>
      <button class="btn btn-brass" id="addProductBtn">إضافة</button>
    </div>
    <p id="npUploadStatus" class="upload-status"></p>
  </div>

  <div class="search-box">
    <input id="prodSearchInput" placeholder="🔍 ابحث عن منتج بالاسم أو المرجع أو الكود بار..." oninput="filterProducts()" value="${esc(productSearchTerm)}">
  </div>

  <div id="productsTableWrap">${renderProductsTable()}</div>`;
}

function renderProductsTable(){
  const term = productSearchTerm.trim().toLowerCase();
  const filtered = DB.products.filter(p=>{
    if(!term) return true;
    return String(p.name||'').toLowerCase().includes(term)
        || String(p.barcode||'').toLowerCase().includes(term)
        || String(p.reference||'').toLowerCase().includes(term);
  });

  return `<table><thead><tr>
    <th>صورة</th><th>المرجع</th><th>الكود بار</th><th>المنتج</th>

/* ---------- فتح صفحة الملصقات لمنتج محدد ---------- */
function printLabelForProduct(id){
  const p = DB.products.find(x=>String(x.id)===String(id));
  if(!p) return;
  if(!p.barcode){
    alert('هذا المنتج ليس له كود بار بعد. أضف كود بار له أولًا من صف المنتج ثم احفظ.');
    return;
  }
  const params = new URLSearchParams({ barcode: p.barcode, name: p.name || '' });
  window.open('labels.html?' + params.toString(), '_blank');
}

async function addProduct(){
  const name = document.getElementById('npName').value.trim();
  const reference = document.getElementById('npReference').value.trim();
  const barcode = document.getElementById('npBarcode').value.trim();
  const desc = document.getElementById('npDesc').value.trim();
  const costPrice = parseFloat(document.getElementById('npCost').value)||0;
  const price = parseFloat(document.getElementById('npPrice').value);
  const wholesalePrice = parseFloat(document.getElementById('npWholesale').value)||0;
  const stock = parseInt(document.getElementById('npStock').value);
  const fileInput = document.getElementById('npImageFile');
  const statusEl = document.getElementById('npUploadStatus');
  const btn = document.getElementById('addProductBtn');
  if(!name||!price||!stock){ alert('أكمل على الأقل: الاسم، سعر البيع، الكمية'); return; }

  btn.disabled = true;
  let imageUrl = '';
  if(fileInput.files && fileInput.files[0]){
    statusEl.className = 'upload-status';
    statusEl.style.display='block';
    statusEl.textContent = 'جاري رفع الصورة...';
    const uploadRes = await uploadImageFile(fileInput.files[0]);
    if(uploadRes.ok){
      imageUrl = uploadRes.url;
      statusEl.className = 'upload-status ok';
      statusEl.textContent = 'تم رفع الصورة ✅';
    } else {
      statusEl.className = 'upload-status err';
      statusEl.textContent = 'تعذّر رفع الصورة (' + (uploadRes.error||'') + ') — سيُضاف المنتج بدون صورة.';
    }
  }

  const palette = ['#B24B32','#1F5F58','#D9A441','#5B3A5C','#6E7F52'];
  const colors = [palette[Math.floor(Math.random()*5)]];
  const res = await callApi('addProduct', {name, reference, barcode, desc, price, costPrice, wholesalePrice, stock, colors, image:imageUrl, top:'linear-gradient(120deg,#332E28,#201D1A)'});
  btn.disabled = false;
  if(res.ok){ await refreshAll(); switchTab('products'); }
  else if(res.error === 'duplicate_barcode'){ alert('هذا الكود بار مستخدم بالفعل لمنتج آخر (رقم '+res.productId+')'); }
  else alert('فشلت الإضافة');
}

async function saveProductEdits(id){
  const reference = document.getElementById('ref-'+id).value.trim();
  const costPrice = parseFloat(document.getElementById('cost-'+id).value)||0;
  const price = parseFloat(document.getElementById('price-'+id).value)||0;
  const wholesalePrice = parseFloat(document.getElementById('wholesale-'+id).value)||0;
  const stock = parseInt(document.getElementById('stock2-'+id).value)||0;
  const res = await callApi('updateProduct', {id, reference, costPrice, price, wholesalePrice, stock});
  if(res.ok){ await refreshAll(); switchTab('products'); } else alert('فشل حفظ التعديلات');
}

async function changeProductImage(id, file, inputEl){
  if(!file) return;
  inputEl.disabled = true;
  const uploadRes = await uploadImageFile(file);
  if(uploadRes.ok){
    const res = await callApi('updateProduct', {id, image: uploadRes.url});
    if(res.ok){ await refreshAll(); switchTab('products'); return; }
  }
  inputEl.disabled = false;
  alert('تعذّر رفع الصورة: ' + (uploadRes.error||'خطأ غير معروف'));
}

async function deleteProduct(id){
  if(!confirm('تأكيد حذف هذا المنتج؟')) return;
  const res = await callApi('deleteProduct', {id});
  if(res.ok){ await refreshAll(); switchTab('products'); }
}

/* ---------- الطلبات والديون (مع إمكانية تعديل الفاتورة) ---------- */
function renderOrders(){
  if(DB.orders.length===0) return '<div class="empty-note">لا توجد طلبات بعد</div>';
  return `<table><thead><tr>
    <th>رقم</th><th>الزبون</th><th>الهاتف</th><th>التاريخ</th><th>الإجمالي</th>
    <th>المدفوع</th><th>المتبقي</th><th>تسجيل دفعة</th><th>الفاتورة</th>
  </tr></thead>
  <tbody>${DB.orders.map(o=>{
    const cls = o.remaining<=0?'pay-full':(o.paid>0?'pay-partial':'pay-none');
    const label = o.remaining<=0?'مدفوع بالكامل':(o.paid>0?'جزئي':'غير مدفوع');
    let rowHtml = `<tr>
      <td>#${o.id}</td><td>${esc(o.name)}</td><td>${esc(o.phone)}</td>
      <td>${formatDate(o.date)}</td><td>${fmt(o.total)}</td>
      <td>${fmt(o.paid)}</td>
      <td class="${cls}">${fmt(o.remaining)} <br><small>${label}</small></td>
      <td><input class="mini-input" type="number" id="paid-${o.id}" placeholder="مبلغ">
        <button class="mini-btn mini-brass" onclick="updatePayment(${o.id})">تسجيل</button></td>
      <td><button class="mini-btn ${openOrderEdit===o.id?'mini-gray':'mini-brass'}" onclick="toggleOrderEdit(${o.id})">${openOrderEdit===o.id?'إغلاق':'تعديل'}</button></td>
    </tr>`;
    if(openOrderEdit === o.id){ rowHtml += renderOrderEditRow(o); }
    return rowHtml;
  }).join('')}</tbody></table>`;
}

function renderOrderEditRow(o){
  const itemsHtml = (o.items||[]).map((it,idx)=>{
    const product = DB.products.find(p=>String(p.id)===String(it.id));
    const costPrice = product ? product.costPrice : null;
    const displayName = it.name || (product ? product.name : ('منتج #'+it.id));
    return `<tr>
      <td>${esc(displayName)}</td>
      <td><input type="number" class="mini-input" id="oi-qty-${o.id}-${idx}" value="${it.qty||0}" oninput="recalcOrderTotal(${o.id})"></td>
      <td><input type="number" class="mini-input" id="oi-price-${o.id}-${idx}" value="${it.price||0}" oninput="recalcOrderTotal(${o.id})"></td>
      <td class="cost-hint">${costPrice!=null ? 'سعر الشراء: '+fmt(costPrice) : '—'}</td>
      <td><button class="mini-btn mini-red" onclick="removeOrderItem(${o.id}, ${idx})">حذف</button></td>
    </tr>`;
  }).join('');

  return `<tr><td colspan="9" style="background:var(--canvas-warm);padding:0;">
    <div class="order-edit-panel">
      <div class="row" style="margin-bottom:12px;">
        <div><span class="field-label">اسم الزبون</span><input id="oe-name-${o.id}" value="${esc(o.name)}"></div>
        <div><span class="field-label">الهاتف</span><input id="oe-phone-${o.id}" value="${esc(o.phone)}"></div>
      </div>
      <table><thead><tr><th>المنتج</th><th>الكمية</th><th>السعر</th><th>سعر الشراء (مرجعي)</th><th></th></tr></thead>
      <tbody>${itemsHtml || '<tr><td colspan="5">لا توجد عناصر في هذا الطلب</td></tr>'}</tbody></table>
      <div style="display:flex;gap:14px;align-items:center;flex-wrap:wrap;">
        <span class="field-label" style="margin:0;">الإجمالي الجديد:</span>
        <input type="number" id="oe-total-${o.id}" value="${o.total}" style="width:130px;">
        <button class="mini-btn mini-brass" onclick="saveOrderEdits(${o.id})">حفظ التعديلات</button>
        <button class="mini-btn mini-gray" onclick="toggleOrderEdit(null)">إلغاء</button>
      </div>
    </div>
  </td></tr>`;
}

function toggleOrderEdit(id){
  openOrderEdit = (openOrderEdit === id) ? null : id;
  switchTab('orders');
}

function recalcOrderTotal(orderId){
  const order = DB.orders.find(o=>String(o.id)===String(orderId));
  if(!order) return;
  let sum = 0;
  (order.items||[]).forEach((it,idx)=>{
    const qtyEl = document.getElementById('oi-qty-'+orderId+'-'+idx);
    const priceEl = document.getElementById('oi-price-'+orderId+'-'+idx);
    const qty = qtyEl ? (parseFloat(qtyEl.value)||0) : 0;
    const price = priceEl ? (parseFloat(priceEl.value)||0) : 0;
    sum += qty*price;
  });
  const totalInput = document.getElementById('oe-total-'+orderId);
  if(totalInput) totalInput.value = sum;
}

function removeOrderItem(orderId, idx){
  const order = DB.orders.find(o=>String(o.id)===String(orderId));
  if(!order) return;
  order.items.splice(idx,1);
  switchTab('orders');
  recalcOrderTotal(orderId);
}

async function saveOrderEdits(orderId){
  const order = DB.orders.find(o=>String(o.id)===String(orderId));
  if(!order) return;
  const name = document.getElementById('oe-name-'+orderId).value.trim();
  const phone = document.getElementById('oe-phone-'+orderId).value.trim();
  const total = parseFloat(document.getElementById('oe-total-'+orderId).value)||0;
  const newItems = (order.items||[]).map((it,idx)=>{
    const qtyEl = document.getElementById('oi-qty-'+orderId+'-'+idx);
    const priceEl = document.getElementById('oi-price-'+orderId+'-'+idx);
    return {
      ...it,
      qty: qtyEl ? (parseFloat(qtyEl.value)||0) : it.qty,
      price: priceEl ? (parseFloat(priceEl.value)||0) : it.price
    };
  });
  const res = await callApi('updateOrder', {id: orderId, name, phone, total, items: newItems});
  if(res.ok){ openOrderEdit = null; await refreshAll(); switchTab('orders'); }
  else alert('فشل حفظ تعديلات الفاتورة');
}

async function updatePayment(id){
  const val = parseFloat(document.getElementById('paid-'+id).value);
  if(isNaN(val)){ alert('أدخل مبلغًا صحيحًا'); return; }
  const res = await callApi('updatePayment', {id, paid: val});
  if(res.ok){ await refreshAll(); switchTab('orders'); }
}
function formatDate(d){ try{ return new Date(d).toLocaleDateString('ar-DZ'); }catch(e){ return d||''; } }
